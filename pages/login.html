<!DOCTYPE html>
<html>
<head>
    <title>Login</title>
</head>
<body>

    <h1>Login</h1>

    <form action="/login" method="POST">

        <p>
            <label>Username</label><br>
            <input
                type="text"
                name="username"
                placeholder="Enter username"
            >
        </p>

        <p>
            <label>Password</label><br>
            <input
                type="password"
                name="password"
                placeholder="Enter password"
            >
        </p>

        <button type="submit">
            Login
        </button>

    </form>

    <p>
        <a href="/">Back to Home</a>
    </p>

</body>
</html>
